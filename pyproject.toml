[project]
name = "cusped-airfoil"
version = "0.1.0"
description = "Post-processing helpers for the cusped-airfoil OpenFOAM case"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyvista>=0.43",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
